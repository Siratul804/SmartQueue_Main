databases:
  - name: smartqueue-db
    databaseName: smartqueue
    user: smartqueue_user
    plan: free

services:
  - type: web
    name: smartqueue-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn smartqueue.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartqueue-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.10.0 # Standardize Python version if needed
